name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CPU-only JAX in CI; mirror the conftest.py allocator settings.
  JAX_PLATFORMS: cpu
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ">=3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Runs the copyright check and the misc file hooks.
      # no-commit-to-branch is a local-only guard and must be skipped in CI.
      # The ruff hooks (lint and format) are skipped here: ruff runs below as
      # an advisory check, which reports but never fails the job.
      - name: Run pre-commit on all files
        run: SKIP=no-commit-to-branch,ruff,ruff-format pre-commit run --all-files --show-diff-on-failure

      - name: Install ruff
        run: pip install ruff==0.4.10

      # Advisory: shows the files ruff would reformat, without failing the job.
      - name: Ruff format (advisory)
        continue-on-error: true
        run: ruff format --check --diff .

      # VA finding CI-F02: ratchet instead of an all-or-nothing check. The
      # repository has legacy ruff violations (mostly missing ANN
      # annotations, E501, E402), so block only on NEW violations introduced
      # by this push/PR, via reviewdog's diff-based filtering. Legacy
      # violations on untouched lines do not fail CI.
      - uses: reviewdog/action-setup@38a8d76742a75eeb6c6ffc616bde64179fd09ebf # v1.5.0

      # reviewdog's github-check reporter only has a real diff to filter
      # against when it can see a pull request; on a plain push it silently
      # drops back to reporting every violation in the whole repo, not just
      # new ones, which defeats the ratchet above. So PR and push need two
      # different invocations.
      # Advisory (continue-on-error): reported, never fails the job.
      - name: Ruff lint (new code only, advisory) [pull_request]
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          ruff check . --output-format=rdjson --exit-zero \
            | reviewdog -f=rdjson -name="ruff (new code)" -reporter=github-check \
                -filter-mode=added -fail-level=error

      # github.event.before is the all-zero SHA on the first push of a new
      # branch (nothing to diff against yet), so skip rather than report
      # everything or nothing in that case.
      - name: Ruff lint (new code only, advisory) [push]
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        run: |
          ruff check . --output-format=rdjson --exit-zero \
            | reviewdog -f=rdjson -name="ruff (new code)" -reporter=local \
                -diff="git diff ${{ github.event.before }} ${{ github.sha }}" \
                -filter-mode=added -fail-level=error

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - uses: reviewdog/action-setup@38a8d76742a75eeb6c6ffc616bde64179fd09ebf # v1.5.0

      # VA finding CI-F02: ratchet -- block only on NEW mypy errors
      # introduced by this push/PR. The repository has legacy mypy errors;
      # those on untouched lines do not fail CI (same reasoning as the lint
      # job above). Split into
      # pull_request/push variants for the same reason as the lint job:
      # github-check's diff filtering only works against an open PR.
      - name: Mypy (new code only, blocking) [pull_request]
        if: ${{ github.event_name == 'pull_request' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          { mypy src/scirex/ 2>&1 || true; } \
            | reviewdog -f=mypy -name="mypy (new code)" -reporter=github-check \
                -filter-mode=added -fail-level=error

      - name: Mypy (new code only, blocking) [push]
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        run: |
          { mypy src/scirex/ 2>&1 || true; } \
            | reviewdog -f=mypy -name="mypy (new code)" -reporter=local \
                -diff="git diff ${{ github.event.before }} ${{ github.sha }}" \
                -filter-mode=added -fail-level=error

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Platform tiers (DEC-4): Ubuntu 22.04 and 24.04 LTS on x86_64, macOS on Apple Silicon.
        os: [ubuntu-22.04, ubuntu-24.04, macos-15]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      # open3d (the "open3d" and "benchmark" extras) loads libEGL and libGL,
      # which the GitHub Ubuntu runners do not have.
      - name: Install system libraries for open3d
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,hpo,open3d,benchmark]"

      # GPU-marked tests are deselected: CI runners have no NVIDIA GPU.
      # Package tests live in tests/, mirroring src/scirex/.
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -m "not gpu" \
            --cov=scirex --cov-report=term-missing --cov-report=xml

      # Tests for the training and benchmark scripts. They run in their own
      # pytest process because many scripts call
      # jax.config.update("jax_enable_x64", False) at import time, which
      # would turn off float64 for the scirex tests if collected together.
      - name: Run script tests
        if: ${{ !cancelled() }}
        run: pytest scripts/tests/ -v --tb=short -m "not gpu"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-py${{ matrix.python-version }}-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore

  # Dependency-range jobs. "lowest-direct" installs the lower bound of every
  # dependency declared in pyproject.toml; "highest" installs the newest version
  # the ranges allow. A lower bound that is too low fails here, not for a user.
  test-resolution:
    name: Tests (${{ matrix.resolution }}, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        resolution: [lowest-direct, highest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # open3d (the "open3d" and "benchmark" extras) loads libEGL and libGL,
      # which the GitHub Ubuntu runners do not have.
      - name: Install system libraries for open3d
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgomp1

      - name: Install dependencies (${{ matrix.resolution }})
        run: |
          python -m pip install --upgrade pip uv
          uv venv .venv
          . .venv/bin/activate
          uv pip install -e ".[dev,hpo,open3d]" --resolution ${{ matrix.resolution }}
          uv pip freeze

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest tests/ -v --tb=short -m "not gpu"

  contributing:
    name: CONTRIBUTING setup and test commands
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      # CONTRIBUTING.md, the PR template, SPDX headers, links and Makefile targets
      # must agree with the repository.
      - name: Check CONTRIBUTING.md is complete and in sync
        run: python scripts/dev/check_contributing.py --strict

      # Run the commands a new contributor is told to run, exactly as written
      # in CONTRIBUTING.md (the blocks marked contributing:setup and
      # contributing:check), in a fresh virtual environment.
      - name: Run the documented setup commands
        run: bash -e <(python scripts/dev/check_contributing.py --commands setup)
        env:
          JAX_PLATFORMS: cpu

      - name: Run the documented check commands
        run: |
          source scirex-venv/bin/activate
          bash -e <(python scripts/dev/check_contributing.py --commands check)

      # Imports, configs, scripts, Dockerfiles, mkdocs nav and doc links must point at
      # files and modules that exist (run inside the environment with scirex installed).
      # `pip install -e ".[all]"` must provide every module the repository imports.
      - name: Check that the all extra covers every import
        run: python scripts/dev/check_extras.py --strict

      - name: Check that references point at real paths
        run: |
          source scirex-venv/bin/activate
          python scripts/dev/check_paths.py --strict

  build:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ">=3.10"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # PEP 561: the typed-package marker must ship in the wheel or downstream
      # type checkers silently treat scirex as untyped.
      - name: Verify wheel ships py.typed
        run: |
          unzip -l dist/*.whl | grep -E '[[:space:]]scirex/py\.typed$'

      - name: Check distribution metadata
        run: |
          pip install twine
          twine check dist/*

  docs:
    name: Build docs (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            doc/requirements_doc.txt

      # mkdocstrings imports the package to render the API reference, so the
      # package (and its JAX deps) must be importable. CPU-only JAX is fine.
      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r doc/requirements_doc.txt

      # --strict turns any broken link / missing nav page / autodoc warning
      # into a build failure.
      - name: Build documentation
        run: mkdocs build --strict
