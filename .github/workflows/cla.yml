# Contributor Licence Agreement check (see CLA.md and CONTRIBUTING.md).
#
# A pull request cannot be merged until its author has signed or is on the allowlist.
# The signatures are stored on the `cla-signatures` branch, not on `main`.
#
# One-time setup in the repository (names stay out of the code):
#   1. Create the branch:  git switch --orphan cla-signatures
#                          git commit --allow-empty -m "CLA signatures" && git push origin cla-signatures
#   2. Settings > Secrets and variables > Actions > Variables:
#      CLA_ALLOWLIST = comma-separated GitHub accounts of ZenteiQ staff who do not sign.
#   3. Settings > Branches: add the check "CLA Assistant" to the required checks.

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target'
      || github.event.comment.body == 'recheck'
      || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      # pull_request_target runs with write access; this job never checks out or runs the
      # pull request's code.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: ${{ format('bot*,dependabot[bot],github-actions[bot],renovate[bot],{0}', vars.CLA_ALLOWLIST) }}
          custom-notsigned-prcomment: >-
            Thank you for your contribution to ScireX. Before we can merge it, please
            read the Contributor Licence Agreement (CLA.md) and, to sign it, comment the exact
            sentence below on this pull request. You sign once for all your later contributions.
            If a company owns what you wrote, write to research@zenteiq.ai.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA.
