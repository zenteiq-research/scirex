name: Publish to PyPI

# Publish a version tag to PyPI through a trusted publisher (OpenID Connect, no API
# token). Start it by hand from the default branch and name the tag to publish:
#
#   gh workflow run publish-pypi.yml -R zenteiq-research/scirex --ref main -f tag=v1.0.0
#
# (Actions → Publish to PyPI → Run workflow → branch main, tag v1.0.0.) Every job checks
# out and builds the tag, not the branch. Pushing a tag uploads nothing. The PyPI trusted
# publisher names this repository and this workflow file (publish-pypi.yml), with no
# environment. Only accounts with write access to the repository can start it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, e.g. v1.0.0"
        required: true
        type: string

concurrency:
  group: publish-pypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and check the distributions
    # Only in the public repository, and only for a version tag.
    if: github.repository == 'zenteiq-research/scirex' && startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0 # the committer check reads the whole history

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Verify the tag matches the version in pyproject.toml
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null || { echo "$TAG is not a tag"; exit 1; }
          TAG_VERSION="${TAG#v}"
          FILE_VERSION=$(python -c "
          import re, pathlib
          m = re.search(r'^version\s*=\s*\"(.*?)\"', pathlib.Path('pyproject.toml').read_text(), re.M)
          print(m.group(1))
          ")
          echo "Tag version:  $TAG_VERSION"
          echo "File version: $FILE_VERSION"
          python -m pip install --quiet packaging
          python -c "
          import sys
          from packaging.version import Version
          sys.exit(0 if Version(sys.argv[1]) == Version(sys.argv[2]) else 1)
          " "$TAG_VERSION" "$FILE_VERSION"

      # CITATION.cff must carry this version and the date of the tagged commit.
      - name: Check the release metadata
        run: python scripts/dev/check_release_metadata.py --strict

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist .

      # twine check, metadata, contents (no checkpoints, data, notebooks, .env or
      # internal paths), licence files. The install test runs in the next job.
      - name: Check the distributions
        run: python scripts/dev/check_package.py --dist dist --no-install --list --strict

      # No developer name or address in the files or in the distributions.
      - name: Check that no committer is named in the release
        run: python scripts/dev/check_no_committers.py --dist dist --strict

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Install the sdist once
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/

      # Install from the sdist with its dependencies, away from the checkout, so a file
      # missing from the source distribution fails here and not on a user's machine.
      - name: Install from the sdist and import every module
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.tar.gz
          cd /tmp
          /tmp/venv/bin/python - <<'PY'
          import importlib, pkgutil, scirex
          print(scirex.__version__, scirex.__file__)
          assert "site-packages" in scirex.__file__
          for mod in pkgutil.walk_packages(scirex.__path__, "scirex."):
              try:
                  importlib.import_module(mod.name)
              except ModuleNotFoundError as e:
                  assert (e.name or "").split(".")[0] != "scirex", (mod.name, e)
          PY

  publish:
    name: Publish to PyPI
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately without a GitHub environment, because the PyPI trusted publisher for 1.0.0
    # names none. A "pypi" environment with required reviewers can be added for later
    # releases, in this job and in the trusted publisher together.
    permissions:
      contents: read
      id-token: write # OpenID Connect token for the trusted publisher
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/

      # Pinned to the COMMIT of v1.14.3, not its annotated tag object: the action pulls an
      # image named after the pinned ref, and only commits have one. v1.14.3 ships twine 7.0.0
      # and packaging 26.2, which accept the Metadata-Version 2.5 that current hatchling writes
      # (v1.13.0's twine 6.1.0 rejects it).
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
