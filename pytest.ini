[pytest]
minversion = 7.0
markers =
    unit: fast tests with JIT disabled, no GPU required
    integration: JIT-compiled tests using XLA cache
    gpu: requires physical NVIDIA GPU

# Package tests live in tests/ (mirroring src/scirex/). scripts/tests/ is NOT
# collected here: several script modules set jax_enable_x64=False at import
# time, which corrupts scirex's float64 tests if both are collected in the
# same process (see ci.yml and Makefile). A bare `pytest` from the repo root
# is therefore safe by default; run scripts/tests/ separately
# (`pytest scripts/tests/`), as CI and `make test` do.
testpaths          = tests
# `src` puts scirex on sys.path so the suite runs from a bare checkout
# (no `pip install -e .` needed); `.` keeps `scripts.*` importable.
pythonpath         = src .
log_cli            = true
log_cli_level      = WARNING
tmp_path_retention_policy = failed
# scirex's own deprecated APIs must not be used internally: a DeprecationWarning
# *attributed to a scirex module* (i.e. raised with stacklevel pointing at
# scirex code, such as an internal import of a deprecated shim) is an error.
# The module field is a regex matched from the start of the module name.
# Tests/user code that call a shim deliberately wrap it in pytest.warns, which
# still captures the warning; warnings attributed to tests.* are unaffected.
filterwarnings =
    error::DeprecationWarning:scirex
