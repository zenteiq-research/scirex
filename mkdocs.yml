site_name: ScireX
site_description: Production-grade JAX/Flax Neural Operators for Scientific Machine Learning
site_url: https://zenteiq-research.github.io/scirex
repo_url: https://github.com/zenteiq-research/scirex
repo_name: GitHub

copyright: >
  © 2026 ZenteiQ AiTech Innovations Pvt. Ltd.
  Documentation licensed under CC BY 4.0; code examples LGPL-3.0-only unless noted.

# Documentation sources live in ./doc (not the MkDocs default ./docs).
docs_dir: doc

# Theme overrides and API templates live inside doc/ but are not site content.
exclude_docs: |
  _overrides/
  _templates/
  _hooks/
  # Written by a maintainer script; shown in tabs on install/logs.md
  install/logs_linux_ubuntu24.04.md
  install/logs_linux_ubuntu24.04_cuda12.md
  install/logs_linux_ubuntu26.04.md
  install/logs_windows11.md
  install/logs_macos27.md
  install/logs_TPUv6e8.md

# Publishes CODE_OF_CONDUCT.md, GOVERNANCE.md and the other root policy files as pages.
hooks:
  - doc/_hooks/project_files.py
  - doc/_hooks/repo_links.py
  - doc/_hooks/page_titles.py
  - doc/_hooks/section_colour.py

theme:
  name: material
  custom_dir: doc/_overrides
  language: custom
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/brand/scirex-logo-header.png
  icon:
    repo: fontawesome/brands/github
  favicon: assets/brand/scirex-icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      custom_templates: doc/_templates
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            members_order: source
            docstring_style: numpy
            docstring_section_style: table
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: false
            filters: ["!^_", "!^setup$"]
            # Flax modules declare their parameters as dataclass fields, so the
            # documented constructor parameters are not in a visible __init__ signature.
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
  - stylesheets/vibrant.css

# MathJax 3 needs no helper scripts. Every external script is pinned to an exact version;
# scripts/tests/test_mkdocs_config.py enforces that.
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - javascripts/home_results.js

